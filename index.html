<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Block Pilot — 打飞机 × 俄罗斯方块</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: #0b1020;
        color: #e8eefc;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 8px; padding: 8px;
      }
      #hud {
        width: min(100%, 420px);
        display: flex; justify-content: space-between; align-items: center;
        font-size: 14px; letter-spacing: 0.02em;
      }
      #hud strong { color: #7dd3fc; }
      #wrap {
        position: relative;
        width: min(100vw - 16px, 420px);
        aspect-ratio: 10 / 22;
        max-height: calc(100vh - 120px);
      }
      canvas {
        width: 100%; height: 100%;
        display: block;
        background: #111827;
        border: 2px solid #334155;
        border-radius: 8px;
        image-rendering: pixelated;
      }
      #touch {
        display: none;
        width: min(100%, 420px);
        gap: 8px;
        margin-top: 4px;
      }
      #touch button {
        flex: 1;
        height: 52px;
        border: none;
        border-radius: 10px;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 18px;
        font-weight: 700;
      }
      #touch button:active { background: #334155; }
      #touch .shoot { background: #7c3aed; }
      #touch .shoot:active { background: #6d28d9; }
      @media (pointer: coarse), (max-width: 720px) {
        #touch { display: flex; }
      }
      #overlay {
        position: absolute; inset: 0;
        display: none;
        align-items: center; justify-content: center;
        background: rgba(2,6,23,0.72);
        border-radius: 8px;
        text-align: center;
        padding: 16px;
      }
      #overlay.show { display: flex; }
      #overlay h2 { font-size: 28px; margin-bottom: 8px; }
      #overlay p { opacity: 0.85; margin-bottom: 12px; }
      #overlay button {
        padding: 10px 18px; border: none; border-radius: 8px;
        background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 16px;
      }
      #hint { font-size: 12px; opacity: 0.65; text-align: center; max-width: 420px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div>分数 <strong id="score">0</strong></div>
        <div>生命 <strong id="lives">3</strong></div>
        <div id="status">进行中</div>
      </div>
      <div id="wrap">
        <canvas id="game" width="300" height="660"></canvas>
        <div id="overlay">
          <div>
            <h2 id="overlay-title">暂停</h2>
            <p id="overlay-msg">按 P / Esc 继续</p>
            <button id="btn-resume" type="button">继续 / 再来一局</button>
          </div>
        </div>
      </div>
      <div id="touch">
        <button type="button" id="btn-left" aria-label="左移">◀</button>
        <button type="button" id="btn-shoot" class="shoot" aria-label="射击">🔥</button>
        <button type="button" id="btn-right" aria-label="右移">▶</button>
        <button type="button" id="btn-pause" aria-label="暂停">⏸</button>
      </div>
      <p id="hint">WASD / 方向键移动 · 空格 / J 射击 · P 暂停 · 打伞加速 · 削格整形 · 消行得分</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
